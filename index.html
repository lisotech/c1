<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SamsChecker - Online Arena</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="about.png">
    
    <!-- Socket.IO for Worldwide Multiplayer -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --light-square: #e2e8f0;
            --dark-square: #475569;
            --highlight: #38bdf8;
            --selected: #facc15;
            --whatsapp-green: #075e54;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        header {
            width: 100%;
            padding: 6px 15px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            background-color: var(--panel-bg);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
            flex-shrink: 0;
        }

        .logo-title-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 6px;
        }

        h1 {
            font-size: 1.3rem;
            color: #38bdf8;
            margin-bottom: 0;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #status {
            font-size: 0.8rem;
            background: rgba(15, 23, 42, 0.6);
            padding: 3px 8px;
            border-radius: 6px;
            text-align: center;
        }

        /* Profile Banner Section */
        .profile-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 6px 14px;
            border-radius: 30px;
            margin-top: 6px;
            margin-bottom: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            max-width: 90vw;
            flex-shrink: 0;
        }

        .profile-img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #38bdf8;
        }

        .profile-text {
            font-size: 0.85rem;
            font-weight: 600;
            color: #f8fafc;
            letter-spacing: 0.3px;
        }

        .game-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 6px 10px 15px 10px;
            gap: 8px;
            max-width: 1200px;
            flex: 1;
        }

        #board-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 4px solid #334155;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: min(52vh, 85vw);
            height: min(52vh, 85vw);
            max-width: 440px;
            max-height: 440px;
        }

        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            height: 100%;
        }

        .light {
            background-color: var(--light-square);
        }

        .dark {
            background-color: var(--dark-square);
        }

        .square.highlight::after {
            content: '';
            width: 25%;
            height: 25%;
            background-color: var(--highlight);
            border-radius: 50%;
            position: absolute;
            opacity: 0.9;
        }

        .square.selected {
            background-color: #64748b !important;
        }

        .piece {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 3px 6px rgba(255,255,255,0.4), 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s ease;
            z-index: 2;
        }

        .piece:hover {
            transform: scale(1.05);
        }

        .piece.red {
            background: radial-gradient(circle at 30% 30%, #f87171, #dc2626);
            border: 2px solid #991b1b;
        }

        .piece.black {
            background: radial-gradient(circle at 30% 30%, #475569, #0f172a);
            border: 2px solid #020617;
        }

        .piece.king::after {
            content: '👑';
            font-size: min(4vw, 20px);
        }

        .sidebar {
            background: var(--panel-bg);
            padding: 8px 12px;
            border-radius: 8px;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .mode-select {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mode-select label {
            font-size: 0.8rem;
            font-weight: bold;
        }

        select, input {
            padding: 5px;
            border-radius: 6px;
            background: #334155;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .online-controls {
            display: none;
            width: 100%;
            gap: 5px;
            margin-top: 5px;
        }

        .btn-group {
            display: flex;
            gap: 6px;
            flex: 1;
            justify-content: flex-end;
        }

        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            transition: background 0.2s;
            white-space: nowrap;
        }

        button:hover {
            background-color: #0369a1;
        }

        button#endTurnBtn {
            background-color: #eab308;
            color: #000;
        }

        footer {
            width: 100%;
            padding: 10px;
            background-color: var(--panel-bg);
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
            z-index: 10;
            flex-shrink: 0;
            margin-top: auto;
        }

        .whatsapp-float {
            position: fixed;
            bottom: 45px;
            right: 15px;
            background-color: var(--whatsapp-green);
            color: #ffffff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            z-index: 100;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s;
        }

        .whatsapp-float:hover {
            background-color: #128c7e;
            transform: scale(1.1);
        }

        .whatsapp-float svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        @media (min-width: 768px) {
            html, body {
                overflow: hidden;
            }
            header {
                padding: 12px 30px;
            }
            h1 {
                font-size: 1.6rem;
            }
            #status {
                font-size: 1rem;
            }
            .profile-banner {
                padding: 8px 18px;
                margin-top: 10px;
                margin-bottom: 0;
            }
            .profile-img {
                width: 44px;
                height: 44px;
            }
            .profile-text {
                font-size: 0.95rem;
            }
            .game-container {
                flex-direction: row;
                justify-content: center;
                align-items: center;
                gap: 20px;
                padding: 15px;
                flex: 1;
            }
            #board-wrapper {
                width: auto;
                height: auto;
            }
            #board {
                width: 60vh;
                height: 60vh;
                max-width: 520px;
                max-height: 520px;
            }
            .sidebar {
                flex-direction: column;
                width: 220px;
                align-items: stretch;
                justify-content: flex-start;
                gap: 10px;
                padding: 12px;
                max-width: none;
            }
            .mode-select {
                flex-direction: column;
                align-items: flex-start;
            }
            select, button, input {
                width: 100%;
            }
            .btn-group {
                flex-direction: column;
            }
            .whatsapp-float {
                bottom: 30px;
                right: 30px;
                width: 45px;
                height: 45px;
            }
            .whatsapp-float svg {
                width: 25px;
                height: 25px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-title-container">
            <img src="about.png" alt="SamsChecker Logo" class="logo-img" onerror="this.style.display='none'">
            <h1>SamsChecker</h1>
        </div>
        <div class="header-controls">
            <div id="status">Current Turn: Red Player</div>
            <!-- Clerk Auth Hook Placeholder -->
            <div id="clerk-auth-container">
                <button onclick="alert('Clerk Authentication active via backend middleware.')" style="font-size: 0.7rem; padding: 4px 8px;">Account</button>
            </div>
        </div>
    </header>

    <div class="profile-banner">
        <img src="about.png" alt="Samson" class="profile-img" onerror="this.style.display='none'">
        <span class="profile-text">I am Samson, Play with me</span>
    </div>

    <div class="game-container">
        <div id="board-wrapper">
            <div id="board"></div>

        <div class="sidebar">

                <label for="gameMode">Game Mode:</label>

            <!-- Online Matchmaking Panel -->

                <input type="text" id="roomInput" placeholder="Room Code" />
                <button onclick="createRoom()" style="background-color: #10b981;">Create Room</button>
                <button onclick="joinRoom()" style="background-color: #6366f1;">Join Room</button>
            </div>

            <div class="btn-group">
                <button id="endTurnBtn" style="display:none;" onclick="manualEndTurn()">End Turn Early</button>
                <button onclick="resetGame()">Restart Game</button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 SamsChecker. All rights reserved.
    </footer>

    <script>
        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');
        const gameModeSelect = document.getElementById('gameMode');
        const endTurnBtn = document.getElementById('endTurnBtn');
        const onlineControls = document.getElementById('onlineControls');
        const roomInput = document.getElementById('roomInput');

        let board = [];
        let turn = 'red'; 
        let selectedPiece = null; 
        let validMoves = []; 
        let forcedPiece = null; 
        let gameMode = 'pve'; 
        let isAiThinking = false;

        // Online multiplayer network variables
        let socket = null;
        let roomCode = null;
        let myPlayerRole = 'red'; // 'red' or 'black'

        function initBoard() {
            board = [];
            for (let r = 0; r < 8; r++) {
                board[r] = [];
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) {
                        if (r < 3) {
                            board[r][c] = { player: 'black', king: false };
                        } else if (r > 4) {
                            board[r][c] = { player: 'red', king: false };
                        } else {
                            board[r][c] = null;
                        }
                    } else {
                        board[r][c] = null;
                    }
                }
            }
            turn = 'red';
            selectedPiece = null;
            validMoves = [];
            forcedPiece = null;
            isAiThinking = false;
            endTurnBtn.style.display = 'none';
            render();
        }

        function changeGameMode() {
            gameMode = gameModeSelect.value;
            if (gameMode === 'online') {
                onlineControls.style.display = 'flex';
                initSocketConnection();
            } else {
                onlineControls.style.display = 'none';
            }
            resetGame();
        }

        function initSocketConnection() {
            if (!socket) {
                // Connect to a public or custom global relay server signaling socket
                socket = io('https://your-socket-server.com', { autoConnect: true });

                socket.on('roomCreated', (data) => {
                    roomCode = data.roomCode;
                    myPlayerRole = data.player;
                    statusElement.innerText = `Room created! Code: ${roomCode}. Waiting for player...`;
                });

                socket.on('startGame', (data) => {
                    statusElement.innerText = `Game started! You are playing as ${myPlayerRole.toUpperCase()}`;
                    initBoard();
                });

                socket.on('updateBoard', (data) => {
                    board = data.boardState;
                    turn = data.nextTurn;
                    forcedPiece = data.forcedPiece;
                    render();
                });

                socket.on('errorMsg', (msg) => {
                    alert(msg);
                });
            }
        }

        function createRoom() {
            let code = roomInput.value.trim() || Math.floor(1000 + Math.random() * 9000).toString();
            roomCode = code;
            if (socket) {
                socket.emit('createRoom', roomCode);
                statusElement.innerText = `Created Room: ${roomCode}`;
            } else {
                alert("Network socket not connected.");
            }
        }

        function joinRoom() {
            let code = roomInput.value.trim();
            if (!code) {
                alert("Please enter a valid room code.");
                return;
            }
            roomCode = code;
            myPlayerRole = 'black';
            if (socket) {
                socket.emit('joinRoom', roomCode);
                statusElement.innerText = `Joined room ${roomCode} as Black.`;
            }
        }

        function getPieceMoves(r, c) {
            let piece = board[r][c];
            if (!piece) return [];
            
            let moves = [];
            const directions = [-1, 1];

            directions.forEach(dr => {
                directions.forEach(dc => {
                    if (!piece.king) {
                        let nextR = r + dr;
                        let nextC = c + dc;

                        if (nextR >= 0 && nextR < 8 && nextC >= 0 && nextC < 8) {
                            let target = board[nextR][nextC];
                            
                            if (!target) {
                                if ((piece.player === 'red' && dr === -1) || (piece.player === 'black' && dr === 1)) {
                                    moves.push({ r: nextR, c: nextC, jump: null, capturedList: [] });
                                }
                            } 
                            else if (target.player !== piece.player) {
                                let jumpR = nextR + dr;
                                let jumpC = nextC + dc;
                                if (jumpR >= 0 && jumpR < 8 && jumpC >= 0 && jumpC < 8 && !board[jumpR][jumpC]) {
                                    moves.push({ r: jumpR, c: jumpC, jump: { r: nextR, c: nextC }, capturedList: [{r: nextR, c: nextC}] });
                                }
                            }
                        }
                    } else {
                        let step = 1;
                        let foundPieceToJump = null;
                        
                        while (true) {
                            let nextR = r + (dr * step);
                            let nextC = c + (dc * step);

                            if (nextR < 0 || nextR >= 8 || nextC < 0 || nextC >= 8) break;

                            let target = board[nextR][nextC];

                            if (!target) {
                                if (!foundPieceToJump) {
                                    moves.push({ r: nextR, c: nextC, jump: null, capturedList: [] });
                                } else {
                                    moves.push({ 
                                        r: nextR, 
                                        c: nextC, 
                                        jump: { r: foundPieceToJump.r, c: foundPieceToJump.c }, 
                                        capturedList: [foundPieceToJump] 
                                    });
                                }
                            } else {
                                if (target.player === piece.player) {
                                    break;
                                } else {
                                    if (foundPieceToJump) {
                                        break;
                                    }
                                    foundPieceToJump = { r: nextR, c: nextC };
                                }
                            }
                            step++;
                        }
                    }
                });
            });
            return moves;
        }

        function render() {
            boardElement.innerHTML = '';
            
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    square.classList.add('square');
                    square.classList.add((r + c) % 2 === 1 ? 'dark' : 'light');
                    square.dataset.row = r;
                    square.dataset.col = c;

                    const moveMatch = validMoves.find(m => m.r === r && m.c === c);
                    if (moveMatch && (!isAiThinking || gameMode === 'pvp')) {
                        square.classList.add('highlight');
                    }

                    if (selectedPiece && selectedPiece.r === r && selectedPiece.c === c) {
                        square.classList.add('selected');
                    }

                    const piece = board[r][c];
                    if (piece) {
                        const pieceElement = document.createElement('div');
                        pieceElement.classList.add('piece', piece.player);
                        if (piece.king) pieceElement.classList.add('king');
                        square.appendChild(pieceElement);
                    }

                    square.addEventListener('click', () => handleSquareClick(r, c));
                    boardElement.appendChild(square);
                }
            }

            if (forcedPiece && (gameMode === 'pvp' || turn === 'red' || (gameMode === 'online' && turn === myPlayerRole))) {
                endTurnBtn.style.display = 'block';
            } else {
                endTurnBtn.style.display = 'none';
            }

            if (gameMode !== 'online') {
                let statusText = `Current Turn: ${turn.toUpperCase()}`;
                if (isAiThinking) {
                    statusText = `AI (Black) is thinking...`;
                } else if (forcedPiece) {
                    statusText += ` (Multi-jump active)`;
                }
                statusElement.innerText = statusText;
            }

            if (gameMode === 'pve' && turn === 'black' && !isAiThinking) {
                isAiThinking = true;
                setTimeout(makeAiMove, 600);
            }
        }

        function handleSquareClick(r, c) {
            if (isAiThinking) return;
            if (gameMode === 'pve' && turn === 'black') return;
            if (gameMode === 'online' && turn !== myPlayerRole) return;

            const piece = board[r][c];

            if (piece && piece.player === turn) {
                if (forcedPiece && (forcedPiece.r !== r || forcedPiece.c !== c)) {
                    return; 
                }

                validMoves = getPieceMoves(r, c);
                selectedPiece = { r, c };
                render();
                return;
            }

            const moveMatch = validMoves.find(m => m.r === r && m.c === c);
            if (moveMatch && selectedPiece) {
                executeMove(selectedPiece.r, selectedPiece.c, moveMatch.r, moveMatch.c, moveMatch.jump, moveMatch.capturedList);
            } else {
                selectedPiece = null;
                validMoves = [];
                render();
            }
        }

        function executeMove(fromR, fromC, toR, toC, jump, capturedList) {
            let piece = board[fromR][fromC];
            board[toR][toC] = piece;
            board[fromR][fromC] = null;

            let wasKingBefore = piece.king;

            if (piece.player === 'red' && toR === 0) piece.king = true;
            if (piece.player === 'black' && toR === 7) piece.king = true;

            let multiJumpActive = false;

            if (capturedList && capturedList.length > 0) {
                capturedList.forEach(cap => {
                    board[cap.r][cap.c] = null;
                });

                let subsequentMoves = getPieceMoves(toR, toC);
                let subsequentJumps = subsequentMoves.filter(m => m.jump !== null);

                if (subsequentJumps.length > 0 && (!wasKingBefore && piece.king ? false : true)) {
                    selectedPiece = { r: toR, c: toC };
                    forcedPiece = { r: toR, c: toC };
                    validMoves = subsequentJumps;
                    multiJumpActive = true;
                    render();
                    
                    if (gameMode === 'pve' && turn === 'black') {
                        setTimeout(() => makeAiMultiJump(toR, toC, subsequentJumps), 500);
                    } else if (gameMode === 'online') {
                        socket.emit('makeMove', { roomCode, boardState: board, nextTurn: turn, forcedPiece });
                    }
                    return;
                }
            }

            if (!multiJumpActive) {
                finalizeTurn();
            }
        }

        function manualEndTurn() {
            if (!forcedPiece) return;
            finalizeTurn();
        }

        function finalizeTurn() {
            selectedPiece = null;
            validMoves = [];
            forcedPiece = null;
            turn = turn === 'red' ? 'black' : 'red';
            isAiThinking = false;
            
            if (gameMode === 'online' && socket) {
                socket.emit('makeMove', { roomCode, boardState: board, nextTurn: turn, forcedPiece: null });
            }

            render();
            checkWinCondition();
        }

        function makeAiMultiJump(r, c, jumps) {
            if (!isAiThinking) return;
            let chosenJump = jumps[Math.floor(Math.random() * jumps.length)];
            executeMove(r, c, chosenJump.r, chosenJump.c, chosenJump.jump, chosenJump.capturedList);
        }

        function makeAiMove() {
            let availableActions = [];
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    let piece = board[r][c];
                    if (piece && piece.player === 'black') {
                        let moves = getPieceMoves(r, c);
                        moves.forEach(m => {
                            availableActions.push({ fromR: r, fromC: c, move: m });
                        });
                    }
                }
            }

            if (availableActions.length === 0) {
                alert('Red Player Wins! (AI has no valid moves)');
                initBoard();
                return;
            }

            let jumpActions = availableActions.filter(a => a.move.jump !== null);
            let chosenAction = jumpActions.length > 0 ? jumpActions[Math.floor(Math.random() * jumpActions.length)] : availableActions[Math.floor(Math.random() * availableActions.length)];

            executeMove(chosenAction.fromR, chosenAction.fromC, chosenAction.move.r, chosenAction.move.c, chosenAction.move.jump, chosenAction.move.capturedList);
        }

        function checkWinCondition() {
            let redCount = 0;
            let blackCount = 0;
            let redHasMoves = false;
            let blackHasMoves = false;

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    let piece = board[r][c];
                    if (piece) {
                        if (piece.player === 'red') {
                            redCount++;
                            if (getPieceMoves(r, c).length > 0) redHasMoves = true;
                        }
                        if (piece.player === 'black') {
                            blackCount++;
                            if (getPieceMoves(r, c).length > 0) blackHasMoves = true;
                        }
                    }
                }
            }

            if (redCount === 0 || (turn === 'red' && !redHasMoves)) {
                alert('Black Player Wins!');
                initBoard();
            } else if (blackCount === 0 || (turn === 'black' && !blackHasMoves)) {
                alert('Red Player Wins!');
                initBoard();
            }
        }

        function resetGame() {
            initBoard();
        }

        initBoard();
    </script>
